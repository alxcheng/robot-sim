<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #11151a; overflow: hidden; font-family: "DejaVu Sans Mono", monospace; }
  #hud { position: absolute; left: 18px; top: 14px; color: #dde3e8; font-size: 15px; line-height: 1.5; text-shadow: 0 1px 2px #000; }
  #hud .title { font-size: 13px; letter-spacing: .14em; color: #86b3c6; }
  #hud b { color: #e3a42c; font-weight: normal; }
  #label { position: absolute; right: 22px; top: 16px; color: #e3a42c; font-size: 26px; letter-spacing: .08em; text-shadow: 0 1px 3px #000; }
  #label.fall { color: #ec6f55; }
  #legend { position: absolute; left: 18px; bottom: 12px; color: #8692a0; font-size: 12px; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="label"></div>
<div id="legend">walker_lab · Rapier 0.36 multibody · 60 Hz × 4 substeps · virtual-leg running controller</div>
<script>
// Expects window.REC (recording JSON) and THREE to be injected before init() is called.
let scene, camera, renderer, meshes = [], camPos = null, camTarget = null, arrow = null;

const COLORS = {
  torso: 0xaab4be, reactor: 0x66727e, waist: 0x5f6a75, plate: 0xc4ccd3, pauldron: 0xb4bec7, head: 0xc4ccd3, arm: 0x8d98a3,
  thigh: 0x8e99a4, shin: 0x8e99a4, meta: 0x7a8591, foot: 0x4b5560, hoof: 0x3a4250, forearm: 0x7f8a95, gimbal: 0x2a323a, wheel: 0x5a6570,
  v_pelvis: 0x6c7782, v_chest: 0xb8c1c9, v_thigh: 0x7c8792, v_shin: 0xa3adb7, v_meta: 0x95a0aa, v_forearm: 0x9aa4ae,
  v_pauldron: 0xc2cad1, ball: 0x3c4651, pack: 0x5d6873, armor: 0xaeb8c1, weapon: 0x3a434d,
  hinge_x: 0x343d47, hinge_y: 0x343d47, pyramid: 0xd0d7dd, v_groin: 0x5a6570, thruster: 0x2b3138,
};
function shapeGeometry(s) {
  if (s.kind === 'ball') return new THREE.SphereGeometry(s.half[0], 20, 14);
  if (s.kind === 'cyl_y') return new THREE.CylinderGeometry(s.half[0], s.half[0], s.half[1] * 2, 20);
  if (s.kind === 'cyl_x') { const g = new THREE.CylinderGeometry(s.half[0], s.half[0], s.half[1] * 2, 20); g.rotateZ(Math.PI / 2); return g; }
  if (s.kind === 'chest') {
    // Tapered box whose front face rises to a point over the face centre.
    const [hx, hy, hz] = s.half, [tt, tb] = s.taper;
    const c = (sx, y, sz, t) => [sx * hx * t, y, sz * hz * t];
    const TFL = c(-1, hy, 1, tt), TFR = c(1, hy, 1, tt), TBL = c(-1, hy, -1, tt), TBR = c(1, hy, -1, tt);
    const BFL = c(-1, -hy, 1, tb), BFR = c(1, -hy, 1, tb), BBL = c(-1, -hy, -1, tb), BBR = c(1, -hy, -1, tb);
    const P = [0, 0, hz * 0.5 * (tt + tb) + 0.55 * hz];
    const quad = (a, b, c2, d) => [a, b, c2, a, c2, d];
    const tris = [
      ...quad(TBL, TBR, BBR, BBL), // back
      ...quad(TFL, TFR, TBR, TBL), // top
      ...quad(BFL, BBL, BBR, BFR), // bottom
      ...quad(TFR, BFR, BBR, TBR), // right
      ...quad(TFL, TBL, BBL, BFL), // left
      P, TFR, TFL, P, BFR, TFR, P, BFL, BFR, P, TFL, BFL, // front pyramid
    ];
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(), 3));
    g.computeVertexNormals();
    return g;
  }
  if (s.kind === 'pyramid') {
    const [hx, hy, hz] = s.half;
    const A = [hx, hy, 0], B = [-hx, hy, 0], C = [-hx, -hy, 0], D = [hx, -hy, 0], P = [0, 0, hz];
    const tris = [P, A, B, P, B, C, P, C, D, P, D, A, A, C, B, A, D, C];
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(), 3));
    g.computeVertexNormals();
    return g;
  }
  const geo = new THREE.BoxGeometry(s.half[0] * 2, s.half[1] * 2, s.half[2] * 2);
  const t = s.taper || [1, 1];
  if (t[0] !== 1 || t[1] !== 1) {
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const k = pos.getY(i) > 0 ? t[0] : t[1];
      pos.setX(i, pos.getX(i) * k);
      pos.setZ(i, pos.getZ(i) * k);
    }
    geo.computeVertexNormals();
  }
  return geo;
}

// Split every triangle into 4, `levels` times (so a part's mesh can bend smoothly).
function subdivide(geo, levels) {
  let g = geo.index ? geo.toNonIndexed() : geo;
  for (let l = 0; l < levels; l++) {
    const p = g.attributes.position.array, out = [];
    for (let i = 0; i < p.length; i += 9) {
      const a = [p[i], p[i + 1], p[i + 2]], b = [p[i + 3], p[i + 4], p[i + 5]], c = [p[i + 6], p[i + 7], p[i + 8]];
      const m = (u, v) => [(u[0] + v[0]) / 2, (u[1] + v[1]) / 2, (u[2] + v[2]) / 2];
      const ab = m(a, b), bc = m(b, c), ca = m(c, a);
      out.push(...a, ...ab, ...ca, ...ab, ...b, ...bc, ...ca, ...bc, ...c, ...ab, ...bc, ...ca);
    }
    g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(out, 3));
  }
  return g;
}

// Original part meshes bent by their FEM metal shells: each vertex follows its 4 nearest shell
// particles (inverse-distance weights), in the part's own frame; tinted by the metal's strain.
window.skinned = [];
function makeSkinned(link, li, s, shell, shellIdx) {
  const g = subdivide(shapeGeometry(s), 3);
  const pos = g.attributes.position.array;
  const n = pos.length / 3, rest = shell.rest, np = rest.length / 3;
  const local = new Float32Array(pos.length), nbr = new Int32Array(n * 4), wts = new Float32Array(n * 4);
  for (let v = 0; v < n; v++) {
    const x = pos[3 * v] + s.offset[0], y = pos[3 * v + 1] + s.offset[1], z = pos[3 * v + 2] + s.offset[2];
    local[3 * v] = x; local[3 * v + 1] = y; local[3 * v + 2] = z;
    const best = [[1e9, 0], [1e9, 0], [1e9, 0], [1e9, 0]];
    for (let i = 0; i < np; i++) {
      const dx = rest[3 * i] - x, dy = rest[3 * i + 1] - y, dz = rest[3 * i + 2] - z, d = dx * dx + dy * dy + dz * dz;
      if (d < best[3][0]) { best[3] = [d, i]; best.sort((a, b) => a[0] - b[0]); }
    }
    let sw = 0;
    for (let k = 0; k < 4; k++) { const wk = 1 / (Math.sqrt(best[k][0]) + 0.01) ** 2; nbr[4 * v + k] = best[k][1]; wts[4 * v + k] = wk; sw += wk; }
    for (let k = 0; k < 4; k++) wts[4 * v + k] /= sw;
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(pos.length), 3));
  const base = new THREE.Color(COLORS[s.tag] ?? 0x888888);
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 0.45, roughness: 0.6, flatShading: true }));
  mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
  scene.add(mesh);
  window.skinned.push({ mesh, li, shellIdx, local, nbr, wts, rest, base });
}

function updateSkinned(f) {
  const M = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3();
  for (const sk of window.skinned) {
    const b = f.b[sk.li];
    M.compose(new THREE.Vector3(b[0], b[1], b[2]), q.set(b[3], b[4], b[5], b[6]), new THREE.Vector3(1, 1, 1));
    const soft = f.soft[sk.shellIdx], P = soft.p, D = soft.d || [];
    const np = sk.rest.length / 3;
    // Particle displacement from where the rigid part would carry it.
    const disp = new Float32Array(np * 3);
    for (let i = 0; i < np; i++) {
      v.set(sk.rest[3 * i], sk.rest[3 * i + 1], sk.rest[3 * i + 2]).applyMatrix4(M);
      disp[3 * i] = P[3 * i] - v.x; disp[3 * i + 1] = P[3 * i + 1] - v.y; disp[3 * i + 2] = P[3 * i + 2] - v.z;
    }
    const pos = sk.mesh.geometry.attributes.position.array, col = sk.mesh.geometry.attributes.color.array;
    const n = pos.length / 3;
    for (let k = 0; k < n; k++) {
      v.set(sk.local[3 * k], sk.local[3 * k + 1], sk.local[3 * k + 2]).applyMatrix4(M);
      let dx = 0, dy = 0, dz = 0, st = 0;
      for (let j = 0; j < 4; j++) {
        const i = sk.nbr[4 * k + j], w = sk.wts[4 * k + j];
        dx += w * disp[3 * i]; dy += w * disp[3 * i + 1]; dz += w * disp[3 * i + 2]; st += w * (D[i] || 0);
      }
      pos[3 * k] = v.x + dx; pos[3 * k + 1] = v.y + dy; pos[3 * k + 2] = v.z + dz;
      const t = Math.min(1, st / 0.10);
      col[3 * k] = sk.base.r + (0.85 - sk.base.r) * t; col[3 * k + 1] = sk.base.g + (0.18 - sk.base.g) * t; col[3 * k + 2] = sk.base.b + (0.12 - sk.base.b) * t;
    }
    sk.mesh.geometry.attributes.position.needsUpdate = true;
    sk.mesh.geometry.attributes.color.needsUpdate = true;
    sk.mesh.geometry.computeVertexNormals();
  }
}

function init(width, height) {
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x11151a);
  scene.fog = new THREE.Fog(0x11151a, 40, 90);
  camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0xdfeaff, 0x2a323a, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(-8, 14, -6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  const sc = sun.shadow.camera; sc.left = -8; sc.right = 8; sc.top = 8; sc.bottom = -8; sc.near = 1; sc.far = 40;
  scene.add(sun); scene.add(sun.target);
  window.sun = sun;

  // Floor: 1 m tiles with a brighter line every 5 m, so speed reads clearly.
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#252d36'; cx.fillRect(0, 0, 512, 512);
  cx.strokeStyle = '#34404c'; cx.lineWidth = 2;
  for (let i = 0; i <= 5; i++) { const p = i * 512 / 5; cx.beginPath(); cx.moveTo(p, 0); cx.lineTo(p, 512); cx.moveTo(0, p); cx.lineTo(512, p); cx.stroke(); }
  cx.strokeStyle = '#55697d'; cx.lineWidth = 5; cx.strokeRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(80, 80);
  tex.anisotropy = 8;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  if (REC.platform) {
    const [h, zEnd] = REC.platform, z0 = -8;
    const plat = new THREE.Mesh(new THREE.BoxGeometry(8, h, zEnd - z0),
      new THREE.MeshStandardMaterial({ color: 0x3a4652, roughness: 0.8 }));
    plat.position.set(0, h / 2, (zEnd + z0) / 2); plat.receiveShadow = true; plat.castShadow = true; scene.add(plat);
    const edge = new THREE.Mesh(new THREE.BoxGeometry(8, 0.02, 0.12), new THREE.MeshBasicMaterial({ color: 0xe3a42c }));
    edge.position.set(0, h + 0.011, zEnd - 0.06); scene.add(edge);
  }

  if (REC.wall) {
    const [x, y, z, hx, hy, hz] = REC.wall;
    const wall = new THREE.Mesh(new THREE.BoxGeometry(2 * hx, 2 * hy, 2 * hz), new THREE.MeshStandardMaterial({ color: 0x6b6f73, roughness: 0.95 }));
    wall.position.set(x, y, z); wall.castShadow = true; wall.receiveShadow = true; scene.add(wall);
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(2 * hx, 0.12, 0.02), new THREE.MeshBasicMaterial({ color: 0xe3a42c }));
    stripe.position.set(x, 0.5, z - hz - 0.011); scene.add(stripe);
  }
  window.softGroup = new THREE.Group(); scene.add(window.softGroup);

  REC.links.forEach((link, li) => {
    const g = new THREE.Group();
    // Parts replaced by metal shells are drawn from the shell mesh instead.
    const shellIdx = REC.shells ? REC.shells.findIndex(sh => sh.link === li) : -1;
    if (shellIdx < 0 && REC.hide && REC.hide.includes(li)) { scene.add(g); meshes.push(g); return; }
    for (const [si, s] of link.shapes.entries()) {
      if (shellIdx >= 0 && REC.shells[shellIdx].shape === si) { makeSkinned(link, li, s, REC.shells[shellIdx], shellIdx); continue; }
      const mat = new THREE.MeshStandardMaterial({ color: COLORS[s.tag] ?? 0x888888, metalness: 0.45, roughness: 0.6 });
      if (window.XRAY) { mat.transparent = true; mat.opacity = 0.22; mat.depthWrite = false; }
      const m = new THREE.Mesh(shapeGeometry(s), mat);
      m.position.set(...s.offset); m.castShadow = true; m.receiveShadow = true;
      g.add(m);
      if (s.kind === 'box' || s.kind === 'pyramid' || s.kind === 'chest') {
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x0a0d10 }));
        edges.position.copy(m.position); g.add(edges);
      }
      if (s.tag === 'reactor') {
        const glow = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.16, 0.02), new THREE.MeshBasicMaterial({ color: 0x86b3c6 }));
        glow.position.set(s.offset[0], s.offset[1], s.offset[2] + s.half[2] + 0.011); g.add(glow);
      }
      if (s.tag === 'head') {
        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.06, 0.02), new THREE.MeshBasicMaterial({ color: 0xe3a42c }));
        visor.position.set(s.offset[0], s.offset[1] + 0.02, s.offset[2] + s.half[2] + 0.011); g.add(visor);
      }
      if (s.tag === 'wheel') {
        const ax = s.half[0] < s.half[2] ? 'x' : 'z';
        const ring = new THREE.Mesh(new THREE.TorusGeometry(Math.max(s.half[0], s.half[2], s.half[1]) * 0.85, 0.03, 8, 32), new THREE.MeshBasicMaterial({ color: 0xe3a42c }));
        if (ax === 'x') ring.rotation.y = Math.PI / 2;
        ring.position.set(...s.offset); g.add(ring);
      }
      if (s.tag === 'thruster') {
        const ring = new THREE.Mesh(new THREE.BoxGeometry(s.half[0] * 2.1, s.half[1] * 0.5, s.half[2] * 2.1), new THREE.MeshBasicMaterial({ color: 0xe3a42c }));
        ring.position.set(...s.offset); g.add(ring);
      }
      if (s.tag === 'weapon') {
        const muzzle = new THREE.Mesh(new THREE.BoxGeometry(s.half[0] * 1.2, 0.05, s.half[2] * 1.2), new THREE.MeshBasicMaterial({ color: 0xe3a42c }));
        muzzle.position.set(s.offset[0], s.offset[1] - s.half[1] - 0.026, s.offset[2]); g.add(muzzle);
      }
      if (s.tag === 'thigh' || s.tag === 'shin' || s.tag === 'meta' || s.tag === 'v_shin') {
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(s.half[0] * 1.2, 0.05, 0.02), new THREE.MeshBasicMaterial({ color: 0xe3a42c }));
        stripe.position.set(s.offset[0], s.offset[1] + s.half[1] * 0.5, s.offset[2] + s.half[2] + 0.011); g.add(stripe);
      }
    }
    scene.add(g); meshes.push(g);
  });
}

function show(i) {
  if (window.CAM && window.CAM !== 'crash') { document.getElementById('hud').style.display = 'none'; document.getElementById('legend').style.display = 'none'; document.getElementById('label').style.display = 'none'; }
  const f = REC.frames[i];
  f.b.forEach((p, k) => {
    meshes[k].position.set(p[0], p[1], p[2]);
    meshes[k].quaternion.set(p[3], p[4], p[5], p[6]);
  });
  const trunk = f.b[0];
  let target = new THREE.Vector3(trunk[0], 1.6, trunk[2]);
  if (window.CAM === 'crash' && f.soft && f.soft.length && !REC.hide) {
    // Follow the armor plate (centroid of its first piece).
    const p = f.soft[0].p; let cx = 0, cy = 0, cz = 0; const n = p.length / 3;
    for (let k = 0; k < p.length; k += 3) { cx += p[k]; cy += p[k + 1]; cz += p[k + 2]; }
    target = new THREE.Vector3(cx / n, Math.max(0.6, cy / n), cz / n);
  }
  const off = window.CAM === 'front' ? new THREE.Vector3(0.0, 0.5, 9.5) : window.CAM === 'side' ? new THREE.Vector3(9.5, 0.4, 0.0)
    : window.CAM === 'back' ? new THREE.Vector3(-5.0, 1.6, -7.5)
    : window.CAM === 'crash' ? (REC.hide ? new THREE.Vector3(6.0, 2.6, -4.2) : new THREE.Vector3(3.6, 0.9, -0.9)) : new THREE.Vector3(7.0, 2.4, 5.5);
  const desired = target.clone().add(off);
  if (!camPos) { camPos = desired.clone(); camTarget = target.clone(); }
  camPos.lerp(desired, 0.08); camTarget.lerp(target, 0.12);
  camera.position.copy(camPos); camera.lookAt(camTarget);
  sun.position.set(target.x - 6, 14, target.z + 6); sun.target.position.copy(target);

  // FEM armor plates: colour by how far each point has been pushed in (grey → amber → red at 10 cm).
  while (softGroup.children.length) { const c = softGroup.children.pop(); c.geometry.dispose(); }
  if (REC.shells && f.soft) updateSkinned(f);
  for (const m of (REC.shells ? [] : (f.soft || []))) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(m.p, 3));
    g.setIndex(m.t);
    const cols = new Float32Array(m.p.length);
    for (let k = 0; k < m.p.length / 3; k++) {
      const t = Math.min(1, Math.max(0, (m.d ? m.d[k] : 0) / 0.10));
      const a = [0.62, 0.66, 0.70], b = [0.94, 0.65, 0.23], c = [0.85, 0.2, 0.15];
      const u = t < 0.3 ? a : b, v = t < 0.3 ? b : c, q = t < 0.3 ? t / 0.3 : (t - 0.3) / 0.7;
      for (let j = 0; j < 3; j++) cols[3 * k + j] = u[j] + (v[j] - u[j]) * q;
    }
    g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    g.computeVertexNormals();
    const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 0.5, roughness: 0.45, side: THREE.DoubleSide, flatShading: true }));
    mesh.castShadow = true; softGroup.add(mesh);
  }
  if (f.dent !== undefined) { window.peakDent = Math.max(window.peakDent || 0, f.dent); }

  // Thruster flames: exhaust points opposite the force; length grows with force (kN).
  if (window.flames) window.flames.forEach(a => scene.remove(a));
  window.flames = [];
  for (const t of (f.thr || [])) {
    const F = new THREE.Vector3(t[3], t[4], t[5]);
    const kn = F.length();
    if (kn < 0.05) continue;
    const dir = F.clone().normalize().negate();
    const len = 0.25 + 0.07 * kn;
    const a = new THREE.ArrowHelper(dir, new THREE.Vector3(t[0], t[1], t[2]), len, 0xffb347, Math.min(0.35, len * 0.45), 0.2);
    scene.add(a); window.flames.push(a);
  }
  // Push arrow for 0.6 s after each push.
  if (arrow) { scene.remove(arrow); arrow = null; }
  for (const p of REC.pushes) {
    if (f.t >= p.t && f.t < p.t + 0.6) {
      const yaw = f.heading;
      const dir = new THREE.Vector3(p.dv_left * Math.cos(yaw) + p.dv_fwd * Math.sin(yaw), 0, -p.dv_left * Math.sin(yaw) + p.dv_fwd * Math.cos(yaw)).normalize();
      const origin = new THREE.Vector3(trunk[0], trunk[1], trunk[2]).sub(dir.clone().multiplyScalar(2.4));
      arrow = new THREE.ArrowHelper(dir, origin, 1.8, 0xe3a42c, 0.5, 0.35); scene.add(arrow);
    }
  }

  const assist = REC.assist > 0 ? `ON (×${REC.assist})` : 'OFF — pure physics';
  document.getElementById('hud').innerHTML =
    `<div class="title">${REC.scenario.toUpperCase()}</div>` +
    `t ${f.t.toFixed(1).padStart(5)} s<br>` +
    `speed <b>${f.speed.toFixed(2)}</b> / cmd ${f.cmd_speed.toFixed(2)} m/s<br>` +
    `heading ${(f.heading * 57.3).toFixed(0)}° / cmd ${(f.cmd_heading * 57.3).toFixed(0)}°<br>` +
    `upright assist ${assist}`;
  if (f.dent !== undefined) {
    document.getElementById('hud').innerHTML += REC.hide ? `<br>every part FEM metal · metal pieces <b>${f.soft.length}</b>` + `<br>slow motion ×${(REC.slowmo || 1)}` : `<br>FEM chest plate: dent <b>${(f.dent * 100).toFixed(1)} cm</b> · peak ${(window.peakDent * 100).toFixed(1)} cm · pieces ${f.soft.length}` +
      `<br>slow motion ×${(REC.slowmo || 1)}`;
  }
  if (window.flightCount === undefined) { window.flightCount = 0; window.frameCount = 0; }
  if (f.t > 2) { window.frameCount++; if (f.feet === 0) window.flightCount++; }
  const pct = window.frameCount ? Math.round(100 * window.flightCount / window.frameCount) : 0;
  if (f.dent === undefined) document.getElementById('hud').innerHTML += `<br>airborne ${pct}% of time` + (f.feet === 0 ? ' <b>● AIRBORNE</b>' : '');
  if (f.toe && f.dent === undefined) {
    const push = [0, 1].filter(k => f.contact[k] && f.toe[k] > 8).map(k => f.toe[k]);
    document.getElementById('hud').innerHTML += push.length ? `<br>toe push-off <b>${Math.max(...push).toFixed(0)}°</b>` : '<br>&nbsp;';
  }
  const lab = document.getElementById('label');
  lab.textContent = f.label; lab.className = f.label === 'FALL' ? 'fall' : '';
  renderer.render(scene, camera);
}
</script>
</body>
